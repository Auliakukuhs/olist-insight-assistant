name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
      # Grup train (PyTorch, transformers, MLflow) sengaja tidak dipasang di CI.
      - name: Pasang dependensi dari lockfile
        run: uv sync --locked --group dev --group ingest --group router --group frontend
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Test
        run: uv run pytest

  keamanan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # seluruh riwayat, supaya kunci di commit lama juga tertangkap
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.21"
      - name: Cari kunci atau password yang ikut ter-commit (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git . --redact --no-banner
      - name: Periksa library dengan celah keamanan yang sudah diketahui (pip-audit)
        run: |
          uv export --frozen --no-hashes --no-emit-project --group dev --group ingest --group router -o /tmp/requirements.txt
          uvx pip-audit==2.10.1 -r /tmp/requirements.txt --disable-pip --no-deps --progress-spinner off

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t olist-api:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name api -p 8000:8000 olist-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
      - name: Pastikan router ONNX terbaca di dalam image
        run: |
          docker run --rm olist-api:ci python -c "from olist_assistant.router.onnx_router import OnnxRouter; p = OnnxRouter().predict('Berapa rata-rata ongkir?'); print(p)"
      - name: Pastikan database SQL terbaca di dalam image
        run: |
          docker run --rm olist-api:ci python -c "from olist_assistant.api.analytics import query; n = query('SELECT COUNT(*) AS n FROM v_ringkasan_seller')[0]['n']; assert n == 3095, n; print(n, 'seller')"
      - name: Pastikan image tidak memuat berkas .env
        run: |
          if docker run --rm olist-api:ci sh -c 'find / -name ".env" -not -path "/proc/*" 2>/dev/null | grep -q .'; then
            echo "Image memuat berkas .env"; exit 1
          fi
