[project]
name = "olist-insight-assistant"
version = "0.1.0"
description = "Chatbot multi-agent untuk customer dan seller di atas data OLIST"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "onnxruntime>=1.31.0",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.6",
]
router = [
    "joblib>=1.6.0",
    "scikit-learn>=1.9.1",
]
train = [
    "mlflow>=3.17.1",
    "onnx>=1.23.2",
    "sentencepiece>=0.2.2",
    "torch>=2.14.1",
    "transformers>=5.20.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/olist_assistant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
